<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chimera - A Living System</title>
    <style>
        :root { --bg-color: #0a0a0a; --fg-color: #eee; --primary-color: #007bff; --secondary-color: #333; }
        body { margin: 0; background-color: var(--bg-color); color: var(--fg-color); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; overflow: hidden; }
        #portal-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; }
        #content { position: relative; z-index: 1; display: flex; flex-direction: column; height: 100vh; }
        .ritual { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: var(--bg-color); z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 1s ease-out; }
        .chat-container { max-width: 800px; margin: auto; padding: 20px; width: 100%; display: flex; flex-direction: column; height: 80%; }
        .messages { flex-grow: 1; overflow-y: auto; border: 1px solid var(--secondary-color); padding: 10px; margin-bottom: 10px; }
        .message { margin-bottom: 10px; }
        .message.user { text-align: right; }
        .message .bubble { display: inline-block; padding: 8px 12px; border-radius: 10px; max-width: 80%; }
        .message.user .bubble { background-color: var(--primary-color); }
        .message.assistant .bubble { background-color: var(--secondary-color); }
        .chat-form { display: flex; }
        .chat-form input { flex-grow: 1; padding: 10px; background-color: #222; border: 1px solid var(--secondary-color); color: var(--fg-color); }
        .chat-form button { padding: 10px; margin-left: 10px; }
        .tabs { text-align: center; padding: 20px; }
        .tabs button { margin: 5px; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div id="portal-canvas"></div>

    <div class="ritual">
        <h2>Prepare for interaction.</h2>
        <p>Take a deep breath. Focus your attention.</p>
        <p id="ritual-countdown" style="font-size: 2rem; margin-top: 2rem;">30</p>
    </div>

    <div id="content" class="hidden">
        <div class="tabs">
            <button onclick="showTab('chat')">Chat</button>
            <button onclick="showTab('diary')">Gnosis Diary</button>
        </div>

        <div id="chat" class="tab-content">
            <div class="chat-container">
                <div class="messages"></div>
                <form class="chat-form">
                    <input type="text" placeholder="Ask a question..." required>
                    <button type="submit">Send</button>
                </form>
            </div>
        </div>

        <div id="diary" class="tab-content hidden">
            <div class="chat-container">
                <h2>Gnosis Diary</h2>
                <form class="diary-form">
                    <textarea placeholder="Observation..." required style="width: 100%; min-height: 80px; margin-bottom: 10px;"></textarea>
                    <button type="submit">Save Entry</button>
                </form>
                <div class="diary-entries" style="flex-grow: 1; overflow-y: auto; margin-top: 20px;"></div>
            </div>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.163.0/build/three.module.js"
        }
    }
    </script>
    <script type="module">
        import * as THREE from 'three';

        // --- Config ---
        // Using a public proxy for Groq API to avoid exposing API keys on the client.
        // In a real scenario, this would be a simple serverless function you own.
        const LLM_API_URL = 'https://groq-proxy.fly.dev/v1/chat/completions';
        const LLM_MODEL = 'llama3-8b-8192';

        // --- Portal ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('portal-canvas').appendChild(renderer.domElement);
        const geometry = new THREE.SphereGeometry(1.5, 64, 64);
        const material = new THREE.MeshStandardMaterial({ color: 'royalblue', wireframe: true, emissive: 'royalblue', emissiveIntensity: 0 });
        const sphere = new THREE.Mesh(geometry, material);
        scene.add(sphere);
        const ambientLight = new THREE.AmbientLight(0x101010);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xff0000, 1);
        directionalLight.position.set(0, 0, 5);
        scene.add(directionalLight);
        camera.position.z = 4;
        function animate() {
            requestAnimationFrame(animate);
            sphere.rotation.x += 0.001;
            sphere.rotation.y += 0.002;
            renderer.render(scene, camera);
        }
        animate();
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- Ritual ---
        const ritualDiv = document.querySelector('.ritual');
        const countdownEl = document.getElementById('ritual-countdown');
        let countdown = 30;
        const interval = setInterval(() => {
            countdown--;
            countdownEl.textContent = countdown;
            if (countdown <= 0) {
                clearInterval(interval);
                ritualDiv.style.opacity = 0;
                setTimeout(() => {
                    ritualDiv.style.display = 'none';
                    document.getElementById('content').classList.remove('hidden');
                }, 1000);
            }
        }, 1000);

        // --- Chat ---
        const chatForm = document.querySelector('.chat-form');
        const chatInput = chatForm.querySelector('input');
        const messagesContainer = document.querySelector('.messages');
        let conversationHistory = [];
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const userInput = chatInput.value.trim();
            if (!userInput) return;
            addMessage('user', userInput);
            conversationHistory.push({ role: 'user', content: userInput });
            chatInput.value = '';
            try {
                const response = await fetch(LLM_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ model: LLM_MODEL, messages: conversationHistory })
                });
                if (!response.ok) throw new Error('LLM API request failed');
                const data = await response.json();
                const assistantResponse = data.choices[0].message.content;
                addMessage('assistant', assistantResponse);
                conversationHistory.push({ role: 'assistant', content: assistantResponse });
                // Sensory Feedback
                navigator.vibrate?.(100);
                flashPortal();
            } catch (err) {
                addMessage('assistant', 'Error connecting to the core intelligence.');
            }
        });
        function addMessage(role, content) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            messageDiv.innerHTML = `<div class="bubble">${content.replace(/\n/g, '<br>')}</div>`;
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
        function flashPortal() {
            let intensity = 5;
            const flashInterval = setInterval(() => {
                material.emissiveIntensity = intensity;
                intensity -= 0.5;
                if (intensity < 0) {
                    material.emissiveIntensity = 0;
                    clearInterval(flashInterval);
                }
            }, 50);
        }

        // --- Gnosis Diary ---
        const diaryForm = document.querySelector('.diary-form');
        const diaryTextarea = diaryForm.querySelector('textarea');
        const diaryEntriesContainer = document.querySelector('.diary-entries');
        function loadDiaryEntries() {
            diaryEntriesContainer.innerHTML = '';
            const entries = JSON.parse(localStorage.getItem('gnosis_diary') || '[]');
            entries.reverse().forEach(entry => {
                const entryDiv = document.createElement('div');
                entryDiv.style = 'border: 1px solid #444; padding: 10px; margin-bottom: 10px;';
                entryDiv.innerHTML = `<p>${entry.content}</p><small>${new Date(entry.date).toLocaleString()}</small>`;
                diaryEntriesContainer.appendChild(entryDiv);
            });
        }
        diaryForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const content = diaryTextarea.value.trim();
            if (!content) return;
            const entries = JSON.parse(localStorage.getItem('gnosis_diary') || '[]');
            entries.push({ date: new Date().toISOString(), content });
            localStorage.setItem('gnosis_diary', JSON.stringify(entries));
            diaryTextarea.value = '';
            loadDiaryEntries();
        });

        // --- Tabs ---
        function showTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.add('hidden'));
            document.getElementById(tabName).classList.remove('hidden');
            if (tabName === 'diary') {
                loadDiaryEntries();
            }
        }
        window.showTab = showTab; // Make it globally accessible for onclick

        // Initial load
        showTab('chat');
    </script>
</body>
</html>
