version: '3.8'

services:
  web:
    build:
      context: ../
      dockerfile: ./infra/web.Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ../:/app
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgres://echovoid:strongpass@db:5432/echovoid
      - NEXTAUTH_URL=http://localhost:3000
      - SIM_LAB_HOST=http://sim-lab:8000
      - OLLAMA_HOST=http://ollama:11434

  sim-lab:
    build:
      context: ../apps/sim-lab
      dockerfile: ../../infra/sim-lab.Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ../apps/sim-lab:/app

  db:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=echovoid
      - POSTGRES_PASSWORD=strongpass
      - POSTGRES_DB=echovoid
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  prometheus:
    image: prom/prometheus:v2.47.2
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:10.1.5
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  loki:
    image: grafana/loki:2.9.0
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  prometheus_data:
  grafana_data:
  loki_data:
